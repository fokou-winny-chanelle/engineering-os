# Version pins used by eos (verified 2026-10-09 from official release pages; see docs/SOURCES.md).
# Change pins in one place, bump VERSION, add a CHANGELOG line, then `eos update` in each project.
# Renovate can keep the pre-commit/CI pins fresh inside projects; these are the defaults new projects get.

[tools]
"bmad-method" = "6.12.1"         # npx bmad-method@6.12.1 install (stable); "@next" = prerelease
"pre-commit" = "4.6.2"
"pre-commit-hooks" = "v6.0.0"
"gitleaks" = "v8.30.1"
"conventional-pre-commit" = "v4.4.0"
"ruff-pre-commit" = "v0.16.10"
"playwright-mcp" = "0.0.83"
"squawk-cli" = "2.68.0"         # core CI: migration safety
"spectral-cli" = "6.17.0"        # scaffold api-contract: @stoplight/spectral-cli (needs Node 22 or 24+)
"schemathesis" = "4.30.1"        # scaffold api-contract: api-fuzz.yml (uvx schemathesis==…)
"k6" = "2.3.0"                   # scaffold load-k6 (grafana/k6 v2.3.0, 2026-09-21; AGPL-3.0, used as a CLI)
"mutmut" = "3.8.0"               # scaffold mutation: Python mutation testing (BSD-3-Clause)
"prometheus" = "3.15.0"          # scaffold ops: promtool check/test rules (Apache-2.0; tarball sha256 below)
"prometheus-sha256" = "2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0"  # linux-amd64.tar.gz, matches upstream sha256sums.txt
"hadolint" = "2.15.1"            # scaffold docker-lint: Dockerfile lint (GPL-3.0, used as a CLI binary)
"hadolint-sha256" = "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"  # hadolint-linux-x86_64, matches upstream checksums.sha256
"opentofu" = "1.13.1"            # scaffold iac: tofu fmt/validate (MPL-2.0)
"opentofu-sha256" = "8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80"  # tofu_1.13.1_linux_amd64.zip, matches upstream SHA256SUMS
"checkov" = "3.3.26"             # scaffold iac: IaC misconfiguration scan via uvx (Apache-2.0)
"opentelemetry-sdk" = "1.45.1"   # scaffold otel-python (Apache-2.0); instrumentation packages are 0.66b1
"opentelemetry-instrumentation" = "0.66b1"
"openfeature-sdk" = "0.10.0"     # scaffold flags (Python, Apache-2.0)
"@opentelemetry/sdk-node" = "0.223.0"   # scaffold otel-node (Apache-2.0)
"@openfeature/server-sdk" = "1.23.0"    # scaffold flags (Node, Apache-2.0)
"stryker" = "10.0.0"             # scaffold mutation: @stryker-mutator/core (Apache-2.0)
"hypothesis" = "6.168.5"         # scaffold property-python (MPL-2.0)
"fast-check" = "4.10.2"          # scaffold property-node (MIT)
"@lhci/cli" = "0.15.1"          # scaffold lighthouse (Apache-2.0; bundles lighthouse 12.6.1; npm, 2025-06)
"eslint-plugin-jsx-a11y" = "6.10.2"  # scaffold eslint-next (MIT); peer eslint <=9, so keep eslint ^9 (as create-next-app 16.4 does)
"style-dictionary" = "5.6.1"      # scaffold design-tokens (Apache-2.0); DTCG 2025.10 input, CSS/JS/Dart output
"maestro" = "2.11.0"              # scaffold mobile: Maestro CLI (cli-2.11.0, 2026-09-29; Apache-2.0)
"maestro-sha256" = "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a"  # maestro.zip, GitHub release asset digest
"openai-python" = "3.28.0"       # scaffold llm-evals: eval runner's provider SDK (uv run --with; Apache-2.0)
"dbt-core" = "1.12.5"            # scaffold analytics: dbt v1 engine (Apache-2.0); v2 engine does not list Postgres yet
"dbt-duckdb" = "1.11.0"          # scaffold analytics: DuckDB adapter for local/CI builds (Apache-2.0)
"nbstripout" = "0.9.1"           # pre-commit hook named in docs/ml/split-leakage-checklist.md (MIT)
"@opentelemetry/api" = "1.9.1"   # scaffold llm-otel (Node helper; Apache-2.0)
"promptfoo" = "0.124.1"          # optional eval CLI named in llm refs (MIT); not required by eos
"diff-cover" = "10.6.0"          # alternative to `eos diff-coverage` (Apache-2.0); not required

[actions]                        # pinned by full commit SHA in generated workflows (bin/eos.py ACTION_PINS)
"actions/checkout" = "v7.0.1"
"actions/setup-node" = "v7.1.0"
"astral-sh/setup-uv" = "v10.3.0"
"pnpm/action-setup" = "v6.0.10"
"oven-sh/setup-bun" = "v2.2.0"
"googleapis/release-please-action" = "v5.0.0"   # scaffold: release
"actions/dependency-review-action" = "v5.0.0"   # scaffold: security
"anchore/sbom-action" = "v0.24.0"
"github/codeql-action" = "v4.38.3"
"oasdiff/oasdiff-action" = "v0.1.18"            # scaffold: api-contract
"subosito/flutter-action" = "v2.23.0"           # stack: flutter (v2.23.0, 2026-03-25)
"jdx/mise-action" = "v5.1.1"                   # scaffold: reproducible (v5.1.1)
"grafana/setup-k6-action" = "v1.2.2"           # scaffold: load-k6 (node24 action, no nested actions)
"actions/upload-artifact" = "v7.0.2"           # scaffold: lighthouse (reports as a private artifact)
"actions/setup-java" = "v6.0.1"                # scaffold: mobile (Maestro needs Java 17)
"reactivecircus/android-emulator-runner" = "v2.38.0"  # scaffold: mobile (Apache-2.0, active)

[runtimes]
"node" = "24"                    # Active LTS today; Node 26 becomes LTS on 2026-10-28
"python" = "3.14"
"postgres" = "18"                # scaffold: compose, tests-python
"redis" = "8"
"flutter" = "3.47.7"             # stable 2026-10-08 (Dart 3.13.5); ci-flutter pin

