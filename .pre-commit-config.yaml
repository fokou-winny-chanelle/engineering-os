# Hooks for the engineering-os repo itself.
default_install_hook_types: [pre-commit, commit-msg]
# Vendored third-party files are hashed in PROVENANCE.json and must stay byte-identical: no fixers there.
exclude: '^packs/vendor/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: '^(packs/stacks/|core/templates/service/|core/scaffold/api-contract/api-fuzz.yml|core/scaffold/mutation/mutation.yml|core/scaffold/lighthouse/lighthouse.yml|core/scaffold/mobile/(mobile-e2e.yml|smoke.yaml|offline-sync.yaml))'  # templates contain {{PLACEHOLDERS}}
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: detect-private-key
      - id: check-executables-have-shebangs
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: eos-budget
        name: eos pack budgets + frontmatter
        entry: python bin/eos.py budget
        language: python
        pass_filenames: false
        files: '^(packs/|core/|personal/)'
      - id: eos-library
        name: eos library lint (deep refs) + vendor check
        entry: python bin/eos.py library lint --and-vendor
        language: python
        pass_filenames: false
        files: '^packs/'
      - id: eos-unit-tests
        name: eos unit tests
        entry: python -m unittest discover -s tests
        language: python
        pass_filenames: false
        files: '^(bin/|tests/|packs/|core/)'
