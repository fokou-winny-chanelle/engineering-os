openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: Example that follows the eos conventions.
  contact: { name: API team, url: "https://example.com/api" }
servers: [{ url: "https://api.example.com/v1" }]
security: [{ bearer: [] }]
tags: [{ name: orders, description: Customer orders }]
paths:
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      description: Newest first. Cursor-paginated.
      tags: [orders]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of orders
          content: { application/json: { schema: { $ref: "#/components/schemas/OrderPage" } } }
        "400": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createOrder
      summary: Create an order
      description: Retry-safe with an Idempotency-Key.
      tags: [orders]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewOrder" } } }
      responses:
        "201":
          description: Created
          headers: { Location: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /orders/{order_id}:
    get:
      operationId: getOrder
      summary: Get an order
      description: Returns one order with its ETag.
      tags: [orders]
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: The order
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /orders/{order_id}:cancel:
    post:
      operationId: cancelOrder
      summary: Cancel an order
      description: Custom method; safe to retry.
      tags: [orders]
      parameters:
        - { name: order_id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: Cancelled order
          content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } }
        "409": { $ref: "#/components/responses/Problem" }
  /health:
    get:
      operationId: health
      summary: Liveness
      description: Public liveness probe.
      tags: [orders]
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } }
        "503": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  responses:
    Problem:
      description: Problem details (RFC 9457)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    NewOrder:
      type: object
      required: [total]
      properties:
        total: { $ref: "#/components/schemas/Money" }
        tax_rate: { type: number }
    Order:
      type: object
      properties:
        id: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        created_at: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Order" } }
        next_cursor: { type: [string, "null"] }
