# engineering-os stack CI: TypeScript/Node (also covers Next.js). Generated by `eos init`.
# Contract: package.json defines lint, typecheck, test (and build).
# Note: if you mark this job as a *required* check, remove the `paths:` filter.
name: ci-node
on:
  pull_request:
    paths: ["**/*.ts", "**/*.tsx", "**/*.js", "**/*.jsx", "**/*.mjs", "**/*.css", "**/package.json", "**/{{LOCKFILE}}", ".github/workflows/ci-node.yml"]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: {{NODE_DIR}}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # diff coverage needs the merge-base with the target branch
          persist-credentials: false
{{PM_SETUP}}      - name: Install (frozen lockfile)
        run: {{PM_INSTALL}}
      - name: Lint
        run: {{PM}} run lint
      - name: Types
        run: {{PM}} run typecheck
      - name: Tests
        run: {{PM}} test
      - name: Diff coverage (changed lines only; stricter on money/auth paths; config testing.* in .eos/config.json)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          DIFF_COVERAGE_MIN: ${{ vars.DIFF_COVERAGE_MIN }}
        run: |
          r=""
          for f in coverage/lcov.info coverage/cobertura-coverage.xml; do [ -f "$f" ] && r="$f" && break; done
          if [ -z "$r" ]; then echo "no coverage report: run tests with coverage (lcov reporter) to gate changed lines"; exit 0; fi
          python3 "$GITHUB_WORKSPACE/.eos/bin/eos.py" diff-coverage "$r" --dir "$GITHUB_WORKSPACE" \
            --base "origin/${BASE_REF}" ${DIFF_COVERAGE_MIN:+--min "$DIFF_COVERAGE_MIN"}
      - name: Build
        run: {{PM}} run --if-present build
      - name: Bundle size (runs a "size" script if you add one, e.g. size-limit)
        run: {{PM}} run --if-present size
      - name: E2E smoke + accessibility (when playwright.config.* exists; `eos scaffold e2e-node`)
        if: hashFiles('{{NODE_PREFIX}}playwright.config.*') != ''
        run: |
          {{PM_EXEC}} playwright install --with-deps chromium
          {{PM}} run test:e2e
      - name: Audit (production deps)
        run: {{PM_AUDIT}}
