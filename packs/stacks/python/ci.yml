# engineering-os stack CI: Python. Generated by `eos init`; edit freely (eos will not overwrite local edits).
# Note: if you mark this job as a *required* check, remove the `paths:` filter (skipped workflows stay "pending").
name: ci-python
on:
  pull_request:
    paths: ["**/*.py", "**/pyproject.toml", "**/uv.lock", ".github/workflows/ci-python.yml"]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: {{PY_DIR}}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # diff coverage needs the merge-base with the target branch
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install (lockfile must be current)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy .
      - name: Tests (+ coverage gate when pytest-cov is installed)
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '80' }}
        run: |
          if uv run python -c "import pytest_cov" 2>/dev/null; then
            uv run pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under="$COVERAGE_MIN"
          else
            echo "::warning::pytest-cov is not installed, so the coverage gate is skipped (uv add --dev pytest-cov)"
            uv run pytest -q
          fi
      - name: Diff coverage (changed lines only; stricter on money/auth paths; config testing.* in .eos/config.json)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          DIFF_COVERAGE_MIN: ${{ vars.DIFF_COVERAGE_MIN }}
        run: |
          r=coverage.xml
          if [ ! -f "$r" ]; then echo "no coverage.xml (install pytest-cov to gate changed lines)"; exit 0; fi
          python3 "$GITHUB_WORKSPACE/.eos/bin/eos.py" diff-coverage "$r" --dir "$GITHUB_WORKSPACE" \
            --base "origin/${BASE_REF}" ${DIFF_COVERAGE_MIN:+--min "$DIFF_COVERAGE_MIN"}
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Dependency audit (pip-audit on the locked set)
        run: |
          uv export --frozen --no-hashes -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip
