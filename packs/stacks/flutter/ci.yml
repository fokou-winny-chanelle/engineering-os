# engineering-os stack CI: Flutter. Generated by `eos init`.
# Pin the Flutter version below (or use .fvmrc via flutter-version-file) so CI matches local.
# Note: if you mark this job as a *required* check, remove the `paths:` filter.
name: ci-flutter
on:
  pull_request:
    paths: ["**/*.dart", "**/pubspec.yaml", "**/pubspec.lock", "**/analysis_options.yaml", ".github/workflows/ci-flutter.yml"]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: {{DIR}}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # diff coverage needs the merge-base with the target branch
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: {{FLUTTER_VERSION}}
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Tests (+ coverage/lcov.info)
        run: flutter test --coverage
      - name: Diff coverage (changed lines only; stricter on money/auth paths; config testing.* in .eos/config.json)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          DIFF_COVERAGE_MIN: ${{ vars.DIFF_COVERAGE_MIN }}
        run: |
          r=coverage/lcov.info
          if [ ! -f "$r" ]; then echo "no coverage/lcov.info"; exit 0; fi
          python3 "$GITHUB_WORKSPACE/.eos/bin/eos.py" diff-coverage "$r" --dir "$GITHUB_WORKSPACE" \
            --base "origin/${BASE_REF}" ${DIFF_COVERAGE_MIN:+--min "$DIFF_COVERAGE_MIN"}
      - name: Android build (debug, proves it compiles)
        if: hashFiles('{{PREFIX}}android/**') != ''
        run: flutter build apk --debug
