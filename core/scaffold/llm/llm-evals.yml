# LLM prompt checks and eval regression gate. Generated by `eos scaffold llm-evals`; yours to edit.
# - prompts: `eos llm check` — prompt frontmatter, declared inputs, untrusted inputs inside tags, no secrets,
#   and the version must be bumped when a prompt's text or settings change (compared with the PR base).
# - evals: run evals/llm/run_evals.py against the real model (capped number of calls), then `eos llm gate`
#   (thresholds per tag + max drop vs the committed baseline). Same-repo PRs and nightly only: fork PRs get no
#   secrets. Results are kept 14 days as a private artifact (no model outputs unless you add --keep-outputs).
# Why: .eos/packs/ref/llm/evals-in-production.md
name: llm-evals
on:
  pull_request:
    paths: ["prompts/**", "**/*.prompt.md", "evals/llm/**", ".github/workflows/llm-evals.yml"]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: llm-evals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: eos llm check (incl. version bump vs the PR base)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .eos/bin/eos.py llm check --base "origin/${BASE_REF:-main}"
  evals:
    needs: prompts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_MAX_CALLS: ${{ github.event_name == 'schedule' && '1000' || '200' }}
      OPENAI_PY_VERSION: "{{OPENAI_PY_VERSION}}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run evals (real model, capped calls)
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "::error::set the OPENAI_API_KEY repository secret"; exit 1; fi
          uv run --no-project --with "openai==${OPENAI_PY_VERSION}" python evals/llm/run_evals.py --max-calls "$EVAL_MAX_CALLS"
      - name: eos llm gate (thresholds + baseline)
        run: python3 .eos/bin/eos.py llm gate evals/llm/results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: llm-eval-results
          path: evals/llm/results.json
          retention-days: 14
          if-no-files-found: ignore
