# eos LLM-application rules for Semgrep: model output reaching code execution, shells, SQL or HTML; AI provider
# keys in client bundles; model calls without an output-token cap; SDK clients left on the 10-minute default
# timeout. Generated by `eos scaffold llm-evals`; run with
#   semgrep scan --config .semgrep/ --error --metrics=off
# (the security scaffold's workflow already does). Prompt files are checked by `eos llm check`.
# Suppress a reviewed false positive with `# nosemgrep: <rule-id>` AND a reason.
# Refs: .eos/packs/ref/security/llm-agent-security.md, .eos/packs/ref/llm/reliability-cost.md
rules:
  # ---------------------------------------------------------------- model output is untrusted input
  - id: eos-llm-output-to-exec
    message: >-
      Model output flows into eval/exec, a shell, or a raw SQL string. A model can be steered by prompt injection
      in anything it reads, so its output is untrusted input (OWASP LLM05 Improper Output Handling). Parse it into
      a validated structure (JSON schema, enum, allow-list) and use parameterised queries; run generated code only
      in a sandbox. Ref: security/llm-agent-security.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: $C.responses.create(...)
      - pattern: $C.responses.parse(...)
      - pattern: $C.chat.completions.create(...)
      - pattern: $C.messages.create(...)
      - pattern: $C.models.generate_content(...)
      - pattern: $AGENT.run_sync(...)
      - pattern: litellm.completion(...)
    pattern-sinks:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - patterns:
          - pattern: subprocess.$F($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: $CUR.execute($Q, ...)
          - focus-metavariable: $Q
      - patterns:
          - pattern: $CUR.executescript($Q)
          - focus-metavariable: $Q
      - patterns:
          - pattern: sqlalchemy.text($Q)
          - focus-metavariable: $Q
      - patterns:
          - pattern: text($Q)
          - focus-metavariable: $Q

  - id: eos-js-llm-output-to-exec
    message: >-
      Model output flows into eval/new Function, a shell, a raw SQL string or innerHTML. Treat it as untrusted
      input (OWASP LLM05): validate it against a schema, use parameterised queries, render as text or through a
      sanitiser, and run generated code only in a sandbox. Ref: security/llm-agent-security.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: $C.responses.create(...)
      - pattern: $C.chat.completions.create(...)
      - pattern: $C.messages.create(...)
      - pattern: $C.models.generateContent(...)
      - pattern: generateText(...)
      - pattern: generateObject(...)
    pattern-sinks:
      - pattern: eval(...)
      - pattern: new Function(...)
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.$queryRawUnsafe($Q, ...)
              - pattern: $DB.$executeRawUnsafe($Q, ...)
              - pattern: $SQL.unsafe($Q, ...)
          - focus-metavariable: $Q
      - patterns:
          - pattern-either:
              - pattern: $EL.innerHTML = $X
              - pattern: $EL.outerHTML = $X
          - focus-metavariable: $X
      - patterns:
          - pattern: $EL.insertAdjacentHTML($POS, $X)
          - focus-metavariable: $X

  # ---------------------------------------------------------------- keys belong on the server
  - id: eos-llm-key-in-client-env
    message: >-
      An AI provider key is read from a public build-time variable (NEXT_PUBLIC_, EXPO_PUBLIC_, VITE_, REACT_APP_,
      PUBLIC_). These are inlined into the client bundle, so anyone can read the key and spend on your account.
      Call your own server route, which holds the key and enforces per-user quotas. Ref: llm/reliability-cost.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: process.env.$NAME
          - pattern: import.meta.env.$NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: ^(NEXT_PUBLIC|EXPO_PUBLIC|VITE|REACT_APP|PUBLIC)_\w*(OPENAI|ANTHROPIC|CLAUDE|GEMINI|GOOGLE_AI|GENAI|MISTRAL|COHERE|GROQ|DEEPSEEK|XAI|GROK|OPENROUTER|TOGETHER|HUGGINGFACE|HF|LLM)\w*(KEY|TOKEN|SECRET)\w*$

  - id: eos-llm-dangerously-allow-browser
    message: >-
      dangerouslyAllowBrowser: true runs the provider SDK in the browser with your secret API key exposed to every
      visitor (the OpenAI and Anthropic SDK docs warn about this). Proxy model calls through your backend.
    severity: ERROR
    languages: [javascript, typescript]
    pattern: "{..., dangerouslyAllowBrowser: true, ...}"

  # ---------------------------------------------------------------- limits on every call
  - id: eos-llm-missing-max-tokens
    message: >-
      Model call without an output-token cap. Without one, a single request can run long and cost far more than
      planned (OWASP LLM10 Unbounded Consumption). Set max_output_tokens (Responses API) or max_completion_tokens /
      max_tokens (Chat Completions). Ref: llm/reliability-cost.
    severity: WARNING
    languages: [python]
    pattern-either:
      - patterns:
          - pattern: $C.responses.create(...)
          - pattern-not: $C.responses.create(..., max_output_tokens=$M, ...)
          - pattern-not: $C.responses.create(..., **$KW)
      - patterns:
          - pattern: $C.chat.completions.create(...)
          - pattern-not: $C.chat.completions.create(..., max_completion_tokens=$M, ...)
          - pattern-not: $C.chat.completions.create(..., max_tokens=$M, ...)
          - pattern-not: $C.chat.completions.create(..., **$KW)

  - id: eos-js-llm-missing-max-tokens
    message: >-
      Model call without an output-token cap (OWASP LLM10 Unbounded Consumption). Set max_output_tokens (Responses
      API), max_completion_tokens (Chat Completions) or maxOutputTokens (AI SDK). Ref: llm/reliability-cost.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - patterns:
          - pattern: "$C.responses.create({...})"
          - pattern-not: "$C.responses.create({..., max_output_tokens: $M, ...})"
      - patterns:
          - pattern: "$C.chat.completions.create({...})"
          - pattern-not: "$C.chat.completions.create({..., max_completion_tokens: $M, ...})"
          - pattern-not: "$C.chat.completions.create({..., max_tokens: $M, ...})"
      - patterns:
          - pattern-either:
              - pattern: "generateText({...})"
              - pattern: "streamText({...})"
          - pattern-not: "generateText({..., maxOutputTokens: $M, ...})"
          - pattern-not: "streamText({..., maxOutputTokens: $M, ...})"

  - id: eos-llm-client-default-timeout
    message: >-
      Provider client without an explicit timeout. The OpenAI SDKs default to 10 minutes (with 2 retries), far
      longer than a web request should wait. Pass timeout= from your latency budget and decide one retry layer.
      Ref: llm/reliability-cost.
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: OpenAI(...)
          - pattern: AsyncOpenAI(...)
          - pattern: Anthropic(...)
          - pattern: AsyncAnthropic(...)
      - pattern-not: $F(..., timeout=$T, ...)
      - pattern-not: $F(..., **$KW)

  - id: eos-js-llm-client-default-timeout
    message: >-
      Provider client without an explicit timeout (the OpenAI SDKs default to 10 minutes with 2 retries). Pass
      timeout (ms) from your latency budget. Ref: llm/reliability-cost.
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: new OpenAI(...)
          - pattern: new Anthropic(...)
      - pattern-not: "new $F({..., timeout: $T, ...})"
