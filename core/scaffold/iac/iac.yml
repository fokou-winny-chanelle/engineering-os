# Infrastructure-as-code gates. Generated by `eos scaffold iac`; yours to edit.
# - tofu fmt / init -backend=false / validate on every root module under {{IAC_DIR}}/ (OpenTofu, MPL-2.0; drop-in
#   for Terraform's CLI. Using Terraform instead? Swap the install step; note its BSL licence).
# - checkov: misconfiguration scan (public buckets, open security groups, unencrypted disks, privileged pods).
#   Run with uvx at a pinned version, no third-party action. (trivy config is an alternative; if you use
#   aquasecurity/trivy-action, pin it by commit SHA: its tags were hijacked in March 2026, CVE-2026-33634.)
# Never applies. Plans need cloud credentials: add a plan job with OIDC (no long-lived keys) when ready, and keep
# `apply` a human-approved step in a protected environment. Why: .eos/packs/ref/ops/iac.md
name: iac
on:
  pull_request:
    paths: ["{{IAC_DIR}}/**", ".checkov.yaml", ".github/workflows/iac.yml"]
  push:
    branches: [main]
    paths: ["{{IAC_DIR}}/**", ".checkov.yaml"]
permissions:
  contents: read
concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOFU_VERSION: "{{OPENTOFU_VERSION}}"
      TOFU_SHA256: "{{OPENTOFU_SHA256}}"
      CHECKOV_VERSION: "{{CHECKOV_VERSION}}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenTofu (checksum-verified)
        run: |
          z="tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$z" "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/$z"
          echo "${TOFU_SHA256}  $RUNNER_TEMP/$z" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$z" tofu -d "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: tofu fmt
        run: tofu fmt -check -recursive -diff {{IAC_DIR}}
      - name: tofu validate (each root module, no backend, no credentials)
        run: |
          mapfile -t dirs < <(git ls-files '{{IAC_DIR}}/*.tf' | xargs -r -n1 dirname | sort -u)
          for d in "${dirs[@]}"; do
            echo "::group::$d"
            tofu -chdir="$d" init -backend=false -input=false -no-color >/dev/null
            tofu -chdir="$d" validate -no-color
            echo "::endgroup::"
          done
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: checkov
        run: uvx "checkov==${CHECKOV_VERSION}" --directory {{IAC_DIR}} --config-file .checkov.yaml
