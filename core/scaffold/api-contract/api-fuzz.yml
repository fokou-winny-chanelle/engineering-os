# Property-based API fuzzing with Schemathesis. Generated by `eos scaffold api-contract`; yours to edit.
# Starts the API in CI, then sends generated requests from {{SPEC}} and checks every response against it:
# no 5xx, documented status codes / content types / schemas, invalid input rejected, secured operations
# refuse missing credentials (`ignored_auth`). Background: .eos/packs/ref/api/testing.md
# Edit "Start the API" for your app. It must use a disposable database (add a `services:` block, see the
# compose scaffold), never production or shared staging: fuzzing creates, changes and deletes data.
# Optional repo secret API_FUZZ_TOKEN: a bearer token for a test user, sent on every request.
# Schemathesis runs via `uvx` at a pinned version (the official action pins its own dependencies by tag only).
name: api-fuzz
on:
  pull_request:
    paths: ["{{SPEC}}", ".github/workflows/api-fuzz.yml"]
  schedule:
    - cron: "23 3 * * 1-5"   # nightly on weekdays: the long run with stateful tests
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_URL: http://127.0.0.1:8000
      PHASES: ${{ github.event_name == 'pull_request' && 'examples,coverage,fuzzing' || 'examples,coverage,fuzzing,stateful' }}
      MAX_EXAMPLES: ${{ github.event_name == 'pull_request' && '25' || '200' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
{{FUZZ_SETUP}}      - name: Start the API (edit for your app)
        run: |
{{API_START}}
      - name: Wait for the API
        run: |
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null "$API_URL/"; then exit 0; fi
            sleep 2
          done
          echo "API did not answer on $API_URL"; cat "$RUNNER_TEMP/api.log" || true; exit 1
      - name: Schemathesis {{SCHEMATHESIS_VERSION}}
        env:
          API_FUZZ_TOKEN: ${{ secrets.API_FUZZ_TOKEN }}
        run: |
          auth=()
          if [ -n "$API_FUZZ_TOKEN" ]; then auth=(-H "Authorization: Bearer $API_FUZZ_TOKEN"); fi
          uvx schemathesis=={{SCHEMATHESIS_VERSION}} run "{{SPEC}}" --url "$API_URL" "${auth[@]}" \
            --phases "$PHASES" --max-examples "$MAX_EXAMPLES" --report junit --report-dir schemathesis-report
      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true
