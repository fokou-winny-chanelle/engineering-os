# eos API conventions for OpenAPI 3.x (Spectral). Generated by `eos scaffold api-contract`; yours to edit.
# Run: npx -y @stoplight/spectral-cli@{{SPECTRAL_VERSION}} lint {{SPEC}} --fail-severity=warn
# Why each rule: .eos/packs/ref/api/ (errors, collections, evolution, reliability). To exempt one operation,
# add an `overrides` entry (https://docs.stoplight.io/docs/spectral/293426e270fac-overrides) with a comment saying why.
extends: [["spectral:oas", recommended]]
rules:
  # Errors: RFC 9457 problem details, and every operation documents its failures.
  eos-errors-problem-json:
    description: 4xx/5xx responses use application/problem+json (RFC 9457).
    message: "Error response should offer application/problem+json (RFC 9457)"
    severity: warn
    given: "$.paths[*][get,put,post,patch,delete].responses[?(@property.match(/^[45]/))].content"
    then:
      function: schema
      functionOptions:
        schema: { type: object, required: ["application/problem+json"] }
  eos-operation-documents-4xx:
    description: Every operation documents at least one 4xx response.
    message: "Operation documents no 4xx response; validation, auth and not-found errors are part of the contract"
    severity: warn
    given: "$.paths[*][get,put,post,patch,delete].responses"
    then:
      function: schema
      functionOptions:
        schema: { type: object, not: { propertyNames: { not: { pattern: "^4" } } } }
  # Collections: wrap lists in an object, paginate with a cursor, cap the page size.
  eos-list-response-is-object:
    description: Top-level JSON responses are objects, never bare arrays (room for paging fields later).
    message: "Return an object such as {items: [...], next_cursor: ...}, not a bare array: adding paging later would break clients"
    severity: error
    given: "$.paths[*][get,post].responses[?(@property.match(/^2/))].content[?(@property.match(/json/))].schema"
    then:
      field: type
      function: pattern
      functionOptions: { notMatch: "^array$" }
  eos-collection-paginated:
    description: A GET whose 200 body is a list envelope (items/data/results/value array) declares a page size and a cursor.
    message: "List GET needs pagination parameters (limit + cursor); adding them later is a breaking change"
    severity: warn
    given:
      - "$.paths[*][?(@property === 'get' && @.responses && @.responses['200'] && @.responses['200'].content && @.responses['200'].content['application/json'] && @.responses['200'].content['application/json'].schema && @.responses['200'].content['application/json'].schema.properties && @.responses['200'].content['application/json'].schema.properties.items && @.responses['200'].content['application/json'].schema.properties.items.type === 'array')]"
      - "$.paths[*][?(@property === 'get' && @.responses && @.responses['200'] && @.responses['200'].content && @.responses['200'].content['application/json'] && @.responses['200'].content['application/json'].schema && @.responses['200'].content['application/json'].schema.properties && @.responses['200'].content['application/json'].schema.properties.data && @.responses['200'].content['application/json'].schema.properties.data.type === 'array')]"
      - "$.paths[*][?(@property === 'get' && @.responses && @.responses['200'] && @.responses['200'].content && @.responses['200'].content['application/json'] && @.responses['200'].content['application/json'].schema && @.responses['200'].content['application/json'].schema.properties && @.responses['200'].content['application/json'].schema.properties.results && @.responses['200'].content['application/json'].schema.properties.results.type === 'array')]"
      - "$.paths[*][?(@property === 'get' && @.responses && @.responses['200'] && @.responses['200'].content && @.responses['200'].content['application/json'] && @.responses['200'].content['application/json'].schema && @.responses['200'].content['application/json'].schema.properties && @.responses['200'].content['application/json'].schema.properties.value && @.responses['200'].content['application/json'].schema.properties.value.type === 'array')]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [parameters]
          properties:
            parameters:
              type: array
              allOf:
                - contains: { type: object, required: [name], properties: { name: { enum: [limit, page_size, pageSize, per_page, max_page_size, maxpagesize] } } }
                - contains: { type: object, required: [name], properties: { name: { enum: [cursor, page_token, pageToken, after, starting_after, next] } } }
  eos-page-size-bounded:
    description: Page-size parameters declare a maximum.
    message: "Page-size parameter needs a schema maximum (an unbounded page is a denial-of-service lever)"
    severity: warn
    given: "$.paths[*][get].parameters[?(@.name && @.name.match(/^(limit|page_size|pageSize|per_page)$/))].schema"
    then:
      field: maximum
      function: truthy
  eos-no-offset-pagination:
    description: Prefer cursor pagination over offset.
    message: "Offset pagination skips or repeats rows under concurrent writes and gets slower with depth; prefer a cursor"
    severity: info
    given: "$.paths[*][get].parameters[?(@.name && @.name.match(/^(offset|skip|page)$/))]"
    then:
      field: name
      function: falsy
  # Naming: resources are nouns in kebab-case; actions are custom methods (POST /things/{id}:cancel).
  eos-path-kebab-case:
    description: Path segments are lowercase kebab-case or {parameters}; custom methods use a :verb suffix.
    message: "Path should be lowercase kebab-case segments and {params} (custom method: /orders/{id}:cancel)"
    severity: warn
    given: "$.paths"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^(/([a-z0-9]+(-[a-z0-9]+)*|\\{[A-Za-z0-9_]+\\}))+(:[a-z][a-zA-Z0-9]*)?$|^/$"
  eos-path-no-crud-verbs:
    description: CRUD verbs belong in the HTTP method, not the path.
    message: "Path contains a CRUD verb; use the HTTP method on a resource noun (POST /orders, not /createOrder)"
    severity: warn
    given: "$.paths"
    then:
      field: "@key"
      function: pattern
      functionOptions:
        notMatch: "\\/(get|create|update|delete|remove|list|add|fetch|save)([-_A-Z/]|$)"
  # Reliability: unsafe creates are retry-safe; deprecations carry a sunset date.
  eos-post-idempotency-key:
    description: POST operations accept an Idempotency-Key header so clients can retry safely.
    message: "POST without an Idempotency-Key header parameter: a retried request may create a duplicate (exempt read-only POSTs via overrides)"
    severity: info
    given: "$.paths[*].post"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [parameters]
          properties:
            parameters:
              type: array
              contains: { type: object, required: [name, in], properties: { name: { pattern: "^[Ii]dempotency-[Kk]ey$" }, in: { const: header } } }
  eos-deprecated-has-sunset:
    description: Deprecated operations carry an x-sunset date (oasdiff enforces the grace period).
    message: "Deprecated operation needs x-sunset: YYYY-MM-DD (and Deprecation/Sunset response headers at runtime)"
    severity: warn
    given: "$.paths[*][?(@property.match(/^(get|put|post|patch|delete)$/) && @.deprecated === true)]"
    then:
      field: x-sunset
      function: truthy
  # Security: every operation is covered by a security requirement (global or per operation).
  eos-security-declared:
    description: "Every operation has a security requirement, global or its own (use security: [] to mark public ones explicitly)."
    message: "Operation has no security requirement and there is no global one; declare it (security: [] for public endpoints)"
    severity: error
    given: "$"
    then:
      function: schema
      functionOptions:
        schema:
          anyOf:
            - { required: [security], properties: { security: { type: array, minItems: 1 } } }
            - properties:
                paths:
                  additionalProperties:
                    properties:
                      get: { required: [security] }
                      put: { required: [security] }
                      post: { required: [security] }
                      patch: { required: [security] }
                      delete: { required: [security] }
  # Data formats: money is never a float; timestamps are date-time strings.
  eos-money-not-float:
    description: Money amounts are integer minor units or decimal strings, never JSON numbers with a float type.
    message: "Money field typed number: use integer minor units (+ currency) or a decimal string"
    severity: error
    given: "$..properties[?(@property.match(/(amount|price|cost|balance|total|fee|tax|salary|revenue|payment|refund|discount|charge|payout|cents)/i) && !@property.match(/(^|_)(rate|ratio|pct|percent|score|weight|factor)s?(_|$)/i) && !@property.match(/(Rate|Ratio|Pct|Percent|Score|Weight|Factor)s?([A-Z_]|$)/))]"
    then:
      field: type
      function: pattern
      functionOptions: { notMatch: "^number$" }
  eos-timestamp-format:
    description: Properties named *_at / *At are RFC 3339 date-time strings.
    message: "Timestamp property should be type string, format date-time (RFC 3339, with offset)"
    severity: warn
    given: "$..properties[?(@property.match(/(_at|[a-z]At)$/))]"
    then:
      function: schema
      functionOptions:
        schema: { required: [format], properties: { format: { const: date-time } } }
