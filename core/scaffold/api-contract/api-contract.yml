# API contract gate. Generated by `eos scaffold api-contract`; yours to edit.
# Contract: the OpenAPI spec is committed at {{SPEC}} and regenerated in the PR that changes the API
# (FastAPI: `python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2))" > {{SPEC}}`).
#  - lint:     Spectral with the eos ruleset in .spectral.yaml (naming, problem details, pagination, security, ...).
#              Fails on errors; warnings show as annotations. Raise --fail-severity to warn once the spec is clean.
#  - breaking: oasdiff blocks incompatible changes. Deprecations need `x-sunset` at least 180 days away
#              (31 for operations marked `x-stability-level: beta`). Background: .eos/packs/ref/api/evolution.md
# `review: false` keeps your spec inside CI (no upload to oasdiff.com); `github-token: ""` posts no PR comment.
name: api-contract
on:
  pull_request:
    paths: ["{{SPEC}}", ".spectral.yaml", ".github/workflows/api-contract.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "{{NODE_MAJOR}}"
      - name: Spectral (eos ruleset)
        run: npx --yes @stoplight/spectral-cli@{{SPECTRAL_VERSION}} lint "{{SPEC}}" --ruleset .spectral.yaml --fail-severity error -f github-actions -f stylish -o.github-actions "<stdout>" -o.stylish "<stdout>"
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git fetch --depth=1 origin "${{ github.base_ref }}"
      - uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: "origin/${{ github.base_ref }}:{{SPEC}}"
          revision: "HEAD:{{SPEC}}"
          fail-on: ERR
          deprecation-days-stable: "180"
          deprecation-days-beta: "31"
          review: false
          github-token: ""
