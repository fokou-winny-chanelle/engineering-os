# Data contract (Open Data Contract Standard v3.2.0) for the fct_daily_payments mart. Generated by
# `eos scaffold analytics`; yours to edit. `eos data check` validates it and, with --base, fails a breaking change
# (removed or retyped column, optional → required, narrower accepted values) unless the major version is bumped.
# Why: .eos/packs/ref/analytics/quality-contracts.md · Standard: https://bitol-io.github.io/open-data-contract-standard/
apiVersion: v3.2.0
kind: DataContract
id: payments-daily
name: Daily payments per merchant
version: "1.0.0"
status: active
domain: payments
team:
  name: data-platform
  members:
    - username: owner@example.com
      role: owner
description:
  purpose: Daily payment totals per merchant for finance reporting and merchant dashboards.
  usage: Read-only. Amounts are integer XAF. One row per merchant per UTC day.
  limitations: Synthetic seed data until real loads are wired in. A refunded payment counts on the day of the original attempt.
schema:
  - name: fct_daily_payments
    physicalName: fct_daily_payments
    physicalType: table
    description: Built by dbt (analytics/models/marts/fct_daily_payments.sql); contract enforced in dbt too.
    properties:
      - name: merchant_day_key
        logicalType: string
        physicalType: VARCHAR
        primaryKey: true
        required: true
        unique: true
      - name: merchant_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        classification: internal
      - name: payment_date
        logicalType: date
        physicalType: DATE
        required: true
      - name: attempts
        logicalType: integer
        physicalType: BIGINT
      - name: succeeded_count
        logicalType: integer
        physicalType: BIGINT
      - name: succeeded_amount_xaf
        logicalType: integer
        physicalType: BIGINT
        description: Sum of succeeded payment amounts, integer XAF.
        quality:
          - metric: nullValues
            mustBe: 0
      - name: refunded_amount_xaf
        logicalType: integer
        physicalType: BIGINT
    quality:
      - metric: rowCount
        mustBeGreaterThan: 0
