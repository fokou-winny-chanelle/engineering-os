# dbt project generated by `eos scaffold analytics`; yours to edit. Why: .eos/packs/ref/analytics/dbt-elt.md
# Layers: seeds (stand-in for raw loads) → staging (rename, cast, one model per source table) → marts (business
# grain, contract enforced). Money is integer XAF (no minor unit); timestamps are UTC.
name: analytics
version: "0.1.0"
profile: analytics
config-version: 2

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages", "logs"]

flags:
  send_anonymous_usage_stats: false  # dbt sends anonymous usage events by default; opt in if you want to

seeds:
  analytics:
    raw_payments:
      +column_types:
        payment_id: varchar
        merchant_id: varchar
        amount_xaf: bigint
        status: varchar
        created_at: timestamp
    raw_merchants:
      +column_types:
        merchant_id: varchar
        merchant_name: varchar
        country: varchar
        created_at: timestamp

models:
  analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
