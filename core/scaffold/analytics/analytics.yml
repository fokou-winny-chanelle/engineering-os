# Analytics CI: build and test the dbt project on DuckDB (seeds → models → data tests + unit tests + contract),
# then check data contracts and notebooks. Generated by `eos scaffold analytics`; yours to edit.
# - dbt runs offline on DuckDB with synthetic seeds; no warehouse credentials are needed or used here.
# - `eos data check --base` fails a breaking contract change without a major version bump.
# Why: .eos/packs/ref/analytics/dbt-elt.md, .eos/packs/ref/analytics/quality-contracts.md
name: analytics
on:
  pull_request:
    paths: ["analytics/**", "contracts/**", "**/*.odcs.yaml", "**/*.ipynb", ".github/workflows/analytics.yml"]
  push:
    branches: [main]
    paths: ["analytics/**", "contracts/**", "**/*.odcs.yaml", "**/*.ipynb", ".github/workflows/analytics.yml"]
permissions:
  contents: read
concurrency:
  group: analytics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DBT_CORE_VERSION: "{{DBT_CORE_VERSION}}"
      DBT_DUCKDB_VERSION: "{{DBT_DUCKDB_VERSION}}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: dbt build (seeds, models, tests, contracts) on DuckDB
        working-directory: analytics
        run: uv run --no-project --with "dbt-core==${DBT_CORE_VERSION}" --with "dbt-duckdb==${DBT_DUCKDB_VERSION}" dbt build --profiles-dir . --target ci
      - name: eos data check (contracts incl. breaking changes vs the PR base, notebooks)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .eos/bin/eos.py data check --base "origin/${BASE_REF:-main}"
