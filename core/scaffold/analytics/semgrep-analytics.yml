# eos analytics rules for Semgrep: personal data sent to product-analytics tools. Generated by `eos scaffold analytics`.
# Run: semgrep scan --config .semgrep/ --error --metrics=off   (the security scaffold's workflow does this)
# Analytics vendors keep events for months and copy them widely; most product questions need a stable pseudonymous
# ID, not an email or phone number. Send an internal user ID; keep contact details in your own database.
# Suppress a reviewed case with `# nosemgrep: <rule-id>` (or `// nosemgrep: <rule-id>`) AND a reason (for example a
# signed processing agreement and a consent record). Ref: .eos/packs/ref/analytics/product-events.md
rules:
  - id: eos-analytics-pii-property
    message: >-
      An analytics event or profile property is named like personal data (email, phone/MSISDN, national ID, date
      of birth, name, address, precise location). Send a pseudonymous user ID instead, and check consent
      (analytics/product-events, analytics/privacy-anonymisation).
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: '$C.$M(..., {..., $K: $V, ...}, ...)'
          - pattern: '$C.$M(..., $KW={..., $K: $V, ...}, ...)'
      - metavariable-regex:
          metavariable: $C
          regex: (?i)^(\w+\.)*(analytics|posthog|mixpanel|segment|amplitude|rudder(stack)?|heap|tracker|firebase_analytics)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(track|capture|identify|alias|group|group_identify|page|screen|register|set|set_once|people_set|log_event)$
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^["']\$?(\w+_)?(e_?mail|phone|phone_number|mobile|msisdn|national_id|id_number|passport|date_of_birth|dob|birth_date|first_name|last_name|full_name|address|street|latitude|longitude|gps|ip_address)["']$

  - id: eos-analytics-pii-value
    message: >-
      A personal-data value (email, phone/MSISDN, national ID, date of birth) is passed to an analytics call, as
      the user ID or a property. Use your internal user ID (analytics/product-events).
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $C.$M(..., $X, ...)
          - pattern: $C.$M(..., $KW=$X, ...)
          - pattern: '$C.$M(..., {..., $K: $X, ...}, ...)'
          - pattern: '$C.$M(..., $KW={..., $K: $X, ...}, ...)'
      - metavariable-regex:
          metavariable: $C
          regex: (?i)^(\w+\.)*(analytics|posthog|mixpanel|segment|amplitude|rudder(stack)?|heap|tracker|firebase_analytics)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(track|capture|identify|alias|group|group_identify|page|screen|register|set|set_once|people_set|log_event)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(.*[.\[])?["']?(\w+_)?(email|phone|phone_number|msisdn|national_id|id_number|date_of_birth|dob)["']?\]?$

  - id: eos-js-analytics-pii-property
    message: >-
      An analytics event or profile property is named like personal data (email, phone/MSISDN, national ID, date
      of birth, name, address, precise location). Send a pseudonymous user ID instead, and check consent
      (analytics/product-events, analytics/privacy-anonymisation).
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: '$C.$M(..., {..., $K: $V, ...}, ...)'
          - pattern: 'gtag(..., {..., $K: $V, ...})'
          - pattern: 'logEvent(..., {..., $K: $V, ...})'
          - pattern: 'setUserProperties(..., {..., $K: $V, ...})'
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^["']?\$?(\w+_)?(e_?mail|emailAddress|phone|phone_?number|phoneNumber|mobile|msisdn|national_?id|nationalId|id_?number|passport|date_?of_?birth|dateOfBirth|dob|birth_?date|first_?name|firstName|last_?name|lastName|full_?name|fullName|address|street|latitude|longitude|gps|ip_?address|ipAddress)["']?$
      - pattern-either:
          - patterns:
              - pattern: $C.$M(...)
              - metavariable-regex:
                  metavariable: $C
                  regex: (?i)^(\w+\.)*(analytics|posthog|mixpanel|segment|amplitude|rudder(stack|analytics)?|heap|tracker|people)$
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(track|capture|identify|alias|group|page|screen|register|register_once|set|set_once|setPersonProperties|logEvent|setUserProperties)$
          - pattern: gtag(...)
          - pattern: logEvent(...)
          - pattern: setUserProperties(...)

  - id: eos-js-analytics-pii-value
    message: >-
      A personal-data value (email, phone/MSISDN, national ID, date of birth) is passed to an analytics call, as
      the user ID or a property. Use your internal user ID (analytics/product-events).
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: $C.$M(..., $X, ...)
          - pattern: '$C.$M(..., {..., $K: $X, ...}, ...)'
      - metavariable-regex:
          metavariable: $C
          regex: (?i)^(\w+\.)*(analytics|posthog|mixpanel|segment|amplitude|rudder(stack|analytics)?|heap|tracker|people)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(track|capture|identify|alias|group|page|screen|register|register_once|set|set_once|setPersonProperties|logEvent|setUserProperties|setUserId)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(.*[.\[])?["']?(\w+_)?(email|emailAddress|phone|phone_?number|phoneNumber|msisdn|national_?id|nationalId|id_?number|date_?of_?birth|dateOfBirth|dob)["']?\]?$
