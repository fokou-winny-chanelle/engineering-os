# Container checks. Generated by `eos scaffold docker-python` / `docker-node`; yours to edit.
# - hadolint: lints every tracked Dockerfile (.hadolint.yaml). Binary from the hadolint release, checked
#   against its sha256 (no third-party action).
# - build: builds each image without pushing, so a broken Dockerfile fails in the PR, not at deploy time.
# Runs only when container files change, never on the fast path. Why: .eos/packs/ref/ops/platforms.md
name: container
on:
  pull_request:
    paths: ["**/Dockerfile*", "**/.dockerignore", ".hadolint.yaml", ".github/workflows/container.yml"]
  push:
    branches: [main]
    paths: ["**/Dockerfile*", "**/.dockerignore", ".hadolint.yaml"]
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HADOLINT_VERSION: "{{HADOLINT_VERSION}}"
      HADOLINT_SHA256: "{{HADOLINT_SHA256}}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hadolint (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
      - name: hadolint
        run: |
          mapfile -t files < <(git ls-files '*Dockerfile' '*Dockerfile.*' '*.Dockerfile')
          if [ ${#files[@]} -eq 0 ]; then echo "no Dockerfiles"; exit 0; fi
          "$RUNNER_TEMP/hadolint" "${files[@]}"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build (no push)
        run: |
          mapfile -t files < <(git ls-files '*Dockerfile')
          for f in "${files[@]}"; do
            d=$(dirname "$f")
            echo "::group::build $f"
            DOCKER_BUILDKIT=1 docker build --file "$f" --tag "ci-check:$(echo "$d" | tr '/.' '--')" "$d"
            echo "::endgroup::"
          done
