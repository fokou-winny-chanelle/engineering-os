# hadolint configuration (Dockerfile lint). Generated by `eos scaffold docker-python` / `docker-node`.
# Rules: https://github.com/hadolint/hadolint#rules . Run locally: hadolint Dockerfile
# info/style findings are printed but do not fail; warnings and errors do. To silence a rule, add its ID to
# `ignored` with a comment saying why, or `# hadolint ignore=DL3008` on the line above the instruction.
failure-threshold: warning
trustedRegistries:
  - docker.io
  - ghcr.io
ignored: []
