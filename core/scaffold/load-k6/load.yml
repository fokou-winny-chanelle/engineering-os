# Load tests with k6. Generated by `eos scaffold load-k6`; yours to edit.
# Never runs on pull requests: load tests are slow, noisy on shared runners and need a deployed target.
# Manual run: Actions → load → Run workflow (pick smoke or load). Weekly: smoke only, when the repository
# variable LOAD_BASE_URL is set (a staging URL, never production without an agreed window).
# Optional secret LOAD_TOKEN: a test user's bearer token. Thresholds in the scripts decide pass or fail.
# GitHub-hosted runners share hardware: use the results to catch regressions, not to quote capacity.
name: load
on:
  workflow_dispatch:
    inputs:
      script:
        description: "smoke or load"
        type: choice
        options: [smoke, load]
        default: smoke
      base_url:
        description: "target URL (default: repository variable LOAD_BASE_URL)"
        required: false
      rate:
        description: "iterations per second at the plateau (load only)"
        required: false
        default: "10"
  schedule:
    - cron: "17 4 * * 1"   # Mondays: smoke against staging
permissions:
  contents: read
concurrency:
  group: load
  cancel-in-progress: false
jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ inputs.base_url || vars.LOAD_BASE_URL }}
      SCRIPT: ${{ inputs.script || 'smoke' }}
      RATE: ${{ inputs.rate || '10' }}
    steps:
      - name: Target set?
        id: target
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::notice::No target: set the repository variable LOAD_BASE_URL or pass base_url"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        if: steps.target.outputs.run == 'true'
        with:
          k6-version: "{{K6_VERSION}}"
      - name: k6 run
        if: steps.target.outputs.run == 'true'
        env:
          LOAD_TOKEN: ${{ secrets.LOAD_TOKEN }}
        run: |
          k6 run -e BASE_URL="$BASE_URL" -e RATE="$RATE" -e LOAD_TOKEN="$LOAD_TOKEN" \
            --summary-export "$RUNNER_TEMP/k6-summary.json" "load/${SCRIPT}.js"
