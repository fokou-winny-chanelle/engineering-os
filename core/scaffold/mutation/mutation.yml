# Incremental mutation testing for risky code. Generated by `eos scaffold mutation`; yours to edit.
# Mutation testing changes your code in small ways (flip a comparison, drop a call) and checks that a test
# fails. It is slow, so it runs only where it pays: on pull requests that change money/auth/security source
# files (risk words in the path, `lanes.risky` globs in .eos/config.json), on any PR labelled lane:risky
# (every changed source file), and weekly over all risky files. Only changed modules/files are mutated.
# A score under the minimum fails the job (repository variable MUTATION_MIN, default 60 = Stryker's "low").
# Background: .eos/packs/ref/testing/mutation.md
name: mutation
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "41 2 * * 0"   # Sundays: all risky files
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python_dir: ${{ steps.plan.outputs.python_dir }}
      python_targets: ${{ steps.plan.outputs.python_targets }}
      node_dir: ${{ steps.plan.outputs.node_dir }}
      node_files: ${{ steps.plan.outputs.node_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Targets (changed risky source files)
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          EOS_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 .eos/bin/eos.py mutation-plan --base "origin/${BASE_REF}" --labels "$EOS_LABELS" --github-output
          else
            python3 .eos/bin/eos.py mutation-plan --all --github-output
          fi
  python:
    needs: plan
    if: needs.plan.outputs.python_targets != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ needs.plan.outputs.python_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv sync --locked
      - name: mutmut {{MUTMUT_VERSION}} on changed modules
        env:
          TARGETS: ${{ needs.plan.outputs.python_targets }}
        run: |
          read -ra targets <<< "$TARGETS"
          uv run --with mutmut=={{MUTMUT_VERSION}} mutmut run "${targets[@]}"
          uv run --with mutmut=={{MUTMUT_VERSION}} mutmut export-cicd-stats
          uv run --with mutmut=={{MUTMUT_VERSION}} mutmut results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Score
        env:
          MUTATION_MIN: ${{ vars.MUTATION_MIN || '60' }}
        run: python3 "$GITHUB_WORKSPACE/.eos/bin/eos.py" mutation-score mutants/mutmut-cicd-stats.json --min "$MUTATION_MIN"
  node:
    needs: plan
    if: needs.plan.outputs.node_files != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ needs.plan.outputs.node_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
{{NODE_SETUP}}      - name: Install
        run: {{PM_INSTALL}}
      - name: Stryker on changed files (incremental)
        env:
          FILES: ${{ needs.plan.outputs.node_files }}
        run: {{PM_EXEC}} stryker run --incremental --mutate "$FILES"
      - name: Score
        env:
          MUTATION_MIN: ${{ vars.MUTATION_MIN || '60' }}
        run: python3 "$GITHUB_WORKSPACE/.eos/bin/eos.py" mutation-score reports/mutation/mutation.json --min "$MUTATION_MIN"
