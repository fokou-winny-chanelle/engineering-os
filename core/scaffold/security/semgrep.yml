# eos security rules for Semgrep. Generated by `eos scaffold security`; yours to edit and extend.
# Run: semgrep scan --config .semgrep/ --error --metrics=off
# Each rule maps to a ref in .eos/packs/ref/security/. Suppress a reviewed false positive on the line with
# `# nosemgrep: <rule-id>` (or `// nosemgrep: <rule-id>`) AND a reason. Test rules: https://docs.semgrep.dev/writing-rules/testing-rules
rules:
  - id: eos-jwt-verify-disabled
    message: >-
      JWT signature verification is disabled or the 'none' algorithm is allowed. Verify with a fixed
      algorithm allow-list and check iss/aud/exp (security/oauth-oidc-jwt, RFC 8725).
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: |
          jwt.decode(..., options={..., "verify_signature": False, ...}, ...)
      - pattern: jwt.decode(..., verify=False, ...)
      - pattern: |
          jwt.decode(..., algorithms=[..., "none", ...], ...)
      - pattern: |
          jwt.decode(..., algorithms=[..., "None", ...], ...)

  - id: eos-js-jwt-verify-disabled
    message: >-
      JWT 'none' algorithm allowed, or jwt.decode() used (it does not verify the signature). Use
      jwt.verify(token, key, { algorithms: [...], audience, issuer }) (security/oauth-oidc-jwt).
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: |
          $JWT.verify($T, $K, {..., algorithms: [..., "none", ...], ...}, ...)
      - pattern: jwt.decode(...)

  - id: eos-non-constant-time-compare
    message: >-
      Signature/MAC/token compared with ==. This leaks timing; use hmac.compare_digest (Python) or
      crypto.timingSafeEqual (Node) (security/crypto, security/payments).
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $A == $B
          - pattern: |
              $A != $B
      - pattern-not: |
          $A == "..."
      - pattern-not: |
          $A != "..."
      - pattern-not: $A == None
      - pattern-not: |
          $A != None
      - metavariable-regex:
          metavariable: $A
          regex: (?i)^[\w.\[\]'"]*(signature|digest|hmac|_mac\b|mac_|token_hash|expected_sig|computed_sig)[\w.\[\]'"]*$

  - id: eos-js-non-constant-time-compare
    message: >-
      Signature/MAC compared with ===/==. Use crypto.timingSafeEqual on equal-length Buffers
      (security/crypto, security/payments).
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: $A === $B
          - pattern: $A == $B
          - pattern: |
              $A !== $B
          - pattern: |
              $A != $B
      - pattern-not: |
          $A === "..."
      - pattern-not: |
          $A !== "..."
      - pattern-not: $A === undefined
      - pattern-not: $A === null
      - metavariable-regex:
          metavariable: $A
          regex: (?i)^[\w.\[\]'"]*(signature|digest|hmac|expectedSig|computedSig)[\w.\[\]'"]*$

  - id: eos-webhook-without-signature-check
    message: >-
      Webhook handler with no visible signature verification. Verify the raw body (provider SDK, or
      webhook_verify.verify_standard / verify_hex_hmac from `eos scaffold security-tests`) before any
      processing (security/payments). If verification happens in a dependency/middleware, add
      `# nosemgrep: eos-webhook-without-signature-check` with where it happens.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: |
          @$APP.$METHOD($PATH, ...)
          def $F(...):
            ...
      - metavariable-regex:
          metavariable: $PATH
          regex: (?i).*(webhook|callback|notify|ipn).*
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(post|route|api_route|put)$
      - pattern-not: |
          @$APP.$METHOD($PATH, ...)
          def $F(..., $P = Depends(...), ...):
            ...
      - pattern-not: |
          @$APP.$METHOD($PATH, ...)
          def $F(...):
            ...
            <... $X.construct_event(...) ...>
            ...
      - pattern-not: |
          @$APP.$METHOD($PATH, ...)
          def $F(...):
            ...
            <... hmac.compare_digest(...) ...>
            ...
      - pattern-not: |
          @$APP.$METHOD($PATH, ...)
          def $F(...):
            ...
            <... verify_standard(...) ...>
            ...
      - pattern-not: |
          @$APP.$METHOD($PATH, ...)
          def $F(...):
            ...
            <... verify_hex_hmac(...) ...>
            ...
      - pattern-not: |
          @$APP.$METHOD($PATH, ...)
          def $F(...):
            ...
            <... $W.verify(...) ...>
            ...

  - id: eos-js-webhook-without-signature-check
    message: >-
      Webhook route with no visible signature verification (constructEvent / timingSafeEqual / verify /
      verifyWebhook). Verify the raw body first (security/payments); if middleware does it, add
      `// nosemgrep: eos-js-webhook-without-signature-check` saying where.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern: $APP.post($PATH, ...)
      - metavariable-regex:
          metavariable: $PATH
          regex: (?i).*(webhook|callback|notify|ipn).*
      - pattern-not: |
          $APP.post($PATH, ..., (...) => {
            ...
            $S.constructEvent(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., async (...) => {
            ...
            $S.constructEvent(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., function (...) {
            ...
            $S.constructEvent(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., async function (...) {
            ...
            $S.constructEvent(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., (...) => {
            ...
            $C.timingSafeEqual(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., async (...) => {
            ...
            $C.timingSafeEqual(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., function (...) {
            ...
            $C.timingSafeEqual(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., async function (...) {
            ...
            $C.timingSafeEqual(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., (...) => {
            ...
            $W.verify(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., async (...) => {
            ...
            $W.verify(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., function (...) {
            ...
            $W.verify(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., async function (...) {
            ...
            $W.verify(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., (...) => {
            ...
            verifyWebhook(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., async (...) => {
            ...
            verifyWebhook(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., function (...) {
            ...
            verifyWebhook(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., async function (...) {
            ...
            verifyWebhook(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., (...) => {
            ...
            timingSafeEqual(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., async (...) => {
            ...
            timingSafeEqual(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., function (...) {
            ...
            timingSafeEqual(...);
            ...
          })
      - pattern-not: |
          $APP.post($PATH, ..., async function (...) {
            ...
            timingSafeEqual(...);
            ...
          })

  - id: eos-js-math-random-secret
    message: >-
      Math.random() used for a security value. Use crypto.randomBytes / crypto.randomUUID /
      crypto.getRandomValues (security/crypto).
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: |
              const $X = <... Math.random() ...>;
          - pattern: |
              let $X = <... Math.random() ...>;
          - pattern: |
              var $X = <... Math.random() ...>;
          - pattern: |
              $X = <... Math.random() ...>
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|apikey|api_key|session|csrf|reset|code).*

  - id: eos-js-sql-template-literal
    message: >-
      SQL built with a template literal and passed to a query function. Use parameters ($1/?) or a
      tagged-template SQL helper that parameterizes (security/input-injection).
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: |
              $DB.$Q(`...${$X}...`, ...)
      - metavariable-regex:
          metavariable: $Q
          regex: ^(query|execute|raw|exec|unsafe|\$queryRawUnsafe|\$executeRawUnsafe)$

  - id: eos-cors-wildcard-credentials
    message: >-
      CORS reflects any origin or uses '*' together with credentials. Use an explicit origin allow-list
      (security/web-api-hardening).
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: |
          cors({..., origin: true, ..., credentials: true, ...})
      - pattern: |
          cors({..., credentials: true, ..., origin: true, ...})
      - pattern: |
          cors({..., origin: "*", ..., credentials: true, ...})
      - pattern: |
          cors({..., credentials: true, ..., origin: "*", ...})

  - id: eos-py-cors-wildcard-credentials
    message: >-
      CORSMiddleware with allow_origins=["*"] (or a catch-all regex) and allow_credentials=True. Use an explicit
      origin list (security/web-api-hardening).
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: |
          $APP.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)
      - pattern: |
          $APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ..., allow_origins=["*"], ...)
      - pattern: |
          $APP.add_middleware(CORSMiddleware, ..., allow_origin_regex=".*", ..., allow_credentials=True, ...)

  - id: eos-tls-verify-disabled
    message: >-
      TLS certificate verification disabled. Never ship this; fix the CA bundle instead
      (security/web-api-hardening). Python equivalents are caught by ruff S501/S323.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: |
          {..., rejectUnauthorized: false, ...}
      - pattern: |
          process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: eos-react-dangerously-set-inner-html
    message: >-
      dangerouslySetInnerHTML renders raw HTML. Only pass sanitized HTML (e.g. DOMPurify.sanitize) and
      review each use (security/input-injection).
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern: |
          <$E dangerouslySetInnerHTML={$V} />
      - pattern-not: |
          <$E dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(...)}} />
