# Maestro smoke flow (black-box, drives the app like a user). Generated by `eos scaffold mobile`; yours to edit.
# Run locally: maestro test .maestro/   Docs: https://docs.maestro.dev/
# Give elements stable accessibility labels or testIDs: it helps automation and screen-reader users alike.
appId: {{APP_ID}}
name: Smoke - app starts and the first screen is usable
tags: [smoke]
---
- launchApp:
    clearState: true
# Replace with text or an id from your first screen (French or English, whichever the test device uses).
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000            # cold start on a slow emulator / low-end phone
- takeScreenshot: smoke-home
