# eos mobile rules for Semgrep (OWASP MASVS v2): insecure token storage, cleartext URLs, trust-all TLS, secrets in the
# public bundle, WebView/deep-link sinks. Generated by `eos scaffold mobile`; run with
#   semgrep scan --config .semgrep/ --error --metrics=off
# (the security scaffold's workflow already does). Manifest/plist/app-config issues are `eos mobile check`.
# Suppress a reviewed false positive with `// nosemgrep: <rule-id>` AND a reason. Ref: .eos/packs/ref/mobile/security-masvs.md
rules:
  # ---------------------------------------------------------------- React Native / Expo (JS, TS)
  - id: eos-rn-asyncstorage-token
    message: >-
      A token, password or key is written to AsyncStorage, which is unencrypted app storage (MASVS-STORAGE-1).
      Use expo-secure-store / react-native-keychain (Keychain, Android Keystore). Ref: mobile/security-masvs.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern: AsyncStorage.setItem($KEY, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|jwt|session|auth|refresh|password|passcode|pin|secret|credential|private).*

  - id: eos-rn-public-env-secret
    message: >-
      EXPO_PUBLIC_* values are inlined into the JavaScript bundle at build time and readable by anyone with the app.
      Expo's docs: do not store sensitive info such as private keys in EXPO_PUBLIC_ variables. Call your server,
      which holds the secret. Ref: mobile/expo-react-native, mobile/security-masvs.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern: process.env.$NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: ^EXPO_PUBLIC_\w*(SECRET|PRIVATE|PASSWORD|PASSWD|SERVICE_ROLE|SIGNING|CREDENTIAL)\w*$

  - id: eos-rn-cleartext-url
    message: >-
      Plain http:// URL in network code: traffic can be read and changed on the way (MASVS-NETWORK-1), and Android 9+
      blocks it by default. Use https. Local development hosts (localhost, 127.0.0.1, 10.0.2.2) are ignored.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: fetch("$URL", ...)
          - pattern: axios.$METHOD("$URL", ...)
          - pattern: 'axios.create({..., baseURL: "$URL", ...})'
          - pattern: new WebSocket("$URL", ...)
      - metavariable-regex:
          metavariable: $URL
          regex: ^(http|ws)://(?!localhost|127\.0\.0\.1|10\.0\.2\.2|10\.0\.3\.2)

  - id: eos-rn-deeplink-to-sink
    message: >-
      A value from a deep link / route parameter reaches Linking.openURL or a WebView URL without validation. A
      malicious link can open phishing pages or other apps (MASVS-PLATFORM-1, MASVS-CODE-4). Check it against an
      allowlist first, e.g. openURL(allowedUrl(url)) where allowedUrl returns a known-safe URL or a fallback.
      Ref: mobile/architecture-state-navigation.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: useLocalSearchParams()
      - pattern: useGlobalSearchParams()
      - pattern: $ROUTE.params
      - pattern: Linking.parse(...)
      - pattern: (await Linking.getInitialURL())
    pattern-sanitizers:
      - pattern: allowedUrl(...)
      - pattern: allowedRoute(...)
    pattern-sinks:
      - pattern: Linking.openURL($X)
      - pattern: 'WebBrowser.openBrowserAsync($X, ...)'
      - patterns:
          - pattern-inside: '<WebView ... source={{uri: $X}} ... />'
          - pattern: $X

  - id: eos-rn-webview-any-origin
    message: >-
      WebView with originWhitelist ['*'] lets any page load inside your app's context; with a JS bridge
      (onMessage/injectedJavaScript) that page can talk to native code (MASVS-PLATFORM-2). List your own https
      origins only.
    severity: WARNING
    languages: [javascript, typescript]
    pattern: <WebView ... originWhitelist={["*"]} ... />

  # ---------------------------------------------------------------- Flutter (Dart)
  - id: eos-dart-bad-certificate-callback
    message: >-
      badCertificateCallback returns true: the app accepts any TLS certificate, so anyone on the network can read
      and change traffic (MASVS-NETWORK-1). Remove it; for local testing use a debug-only trusted CA.
    severity: ERROR
    languages: [dart]
    pattern-either:
      - pattern: $C.badCertificateCallback = ($A, $B, $D) => true;
      - pattern: |
          $C.badCertificateCallback = ($A, $B, $D) {
            return true;
          };

  - id: eos-dart-prefs-token
    message: >-
      A token, password or key is saved with SharedPreferences (plain XML/plist storage, included in backups;
      MASVS-STORAGE-1). Use flutter_secure_storage (Keychain / Keystore). Ref: mobile/security-masvs.
    severity: ERROR
    languages: [dart]
    patterns:
      - pattern: $P.setString($KEY, $V)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|jwt|session|auth|refresh|password|passcode|pin|secret|credential|private).*

  - id: eos-dart-cleartext-url
    message: >-
      Plain http:// URL: traffic can be read and changed on the way (MASVS-NETWORK-1). Use https. Local development
      hosts (localhost, 127.0.0.1, 10.0.2.2) are ignored.
    severity: ERROR
    languages: [dart]
    patterns:
      - pattern-either:
          - pattern: Uri.parse($URL)
          - pattern: 'BaseOptions(..., baseUrl: $URL, ...)'
      - metavariable-regex:
          metavariable: $URL
          regex: ^["']?(http|ws)://(?!localhost|127\.0\.0\.1|10\.0\.2\.2|10\.0\.3\.2)

  # ---------------------------------------------------------------- Android (Kotlin)
  - id: eos-kotlin-trust-all-hostname
    message: >-
      A HostnameVerifier that accepts every host disables TLS identity checks (MASVS-NETWORK-1). Use the default
      verifier.
    severity: ERROR
    languages: [kotlin]
    pattern-either:
      - pattern: HostnameVerifier { $A, $B -> true }
      - pattern: $X.hostnameVerifier { $A, $B -> true }

  - id: eos-kotlin-empty-trust-manager
    message: >-
      checkServerTrusted with an empty body trusts every certificate (MASVS-NETWORK-1). Use the platform trust
      manager; pin keys only via network_security_config with backup pins.
    severity: ERROR
    languages: [kotlin]
    pattern: |
      override fun checkServerTrusted(...) {}

  - id: eos-kotlin-world-readable
    message: >-
      MODE_WORLD_READABLE / MODE_WORLD_WRITEABLE expose app files to every other app (MASVS-STORAGE-2) and throw a
      SecurityException from Android 7. Use private storage.
    severity: ERROR
    languages: [kotlin]
    pattern-either:
      - pattern: Context.MODE_WORLD_READABLE
      - pattern: Context.MODE_WORLD_WRITEABLE
      - pattern: MODE_WORLD_READABLE
      - pattern: MODE_WORLD_WRITEABLE

  - id: eos-kotlin-prefs-token
    message: >-
      A token, password or key is written to SharedPreferences in plain text (MASVS-STORAGE-1). Encrypt it with a
      key held in the Android Keystore (or use a Keystore-backed library). Ref: mobile/security-masvs.
    severity: ERROR
    languages: [kotlin]
    patterns:
      - pattern: $E.putString($KEY, $V)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|jwt|session|auth|refresh|password|passcode|pin|secret|credential|private).*

  - id: eos-kotlin-webview-file-access
    message: >-
      WebView file-URL access lets loaded content read app files or other origins (MASVS-PLATFORM-2). Keep it off;
      load only your own https origins.
    severity: ERROR
    languages: [kotlin]
    pattern-either:
      - pattern: $S.setAllowUniversalAccessFromFileURLs(true)
      - pattern: $S.setAllowFileAccessFromFileURLs(true)
      - pattern: $S.allowUniversalAccessFromFileURLs = true
      - pattern: $S.allowFileAccessFromFileURLs = true

  # ---------------------------------------------------------------- iOS (Swift)
  - id: eos-swift-userdefaults-token
    message: >-
      A token, password or key is saved in UserDefaults (an unencrypted plist, included in backups; MASVS-STORAGE-1).
      Use the Keychain (kSecAttrAccessibleWhenUnlockedThisDeviceOnly). Ref: mobile/security-masvs.
    severity: ERROR
    languages: [swift]
    patterns:
      - pattern: '$D.set($V, forKey: $KEY)'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|jwt|session|auth|refresh|password|passcode|pin|secret|credential|private).*
