# Maestro offline flow: a change made without network is kept, shown as pending, and synced once (Android only:
# setAirplaneMode has no effect on iOS simulators). Generated by `eos scaffold mobile`; yours to edit.
# Matches the airplane-mode check in .eos/packs/ref/mobile/offline-sync.md.
appId: {{APP_ID}}
name: Offline - create while offline, sync on reconnect
tags: [offline]
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- setAirplaneMode: enabled
# Replace these steps with one real write in your app (create an invoice, save a form ...).
- tapOn:
    id: "create-item"
- inputText: "Maestro offline test"
- tapOn:
    id: "save-item"
- assertVisible:
    id: "sync-pending"          # the app shows that the change is waiting
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible:
      id: "sync-pending"
    timeout: 60000              # slow network: give the outbox time to retry
- takeScreenshot: offline-synced
