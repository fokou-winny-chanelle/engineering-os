# Mobile E2E smoke: Maestro flows on an Android emulator (low-RAM profile). Generated by `eos scaffold mobile`.
# Runs nightly, on demand, and on PRs labelled "e2e" (not on every PR: emulators are slow). Every action is pinned
# to a commit SHA; Maestro is pinned to a version and its download is checked against the release checksum.
name: mobile-e2e
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: "{{MAESTRO_VERSION}}"
      MAESTRO_SHA256: "{{MAESTRO_SHA256}}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
{{MOBILE_SETUP}}
      - name: Build a test APK
        run: |
{{MOBILE_BUILD}}
      - name: Install Maestro (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Maestro flows on Android 10 (API 29), 2 GB RAM
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: |
            adb install -r "{{APK_PATH}}"
            maestro test .maestro/ --format junit --output "$RUNNER_TEMP/maestro-report.xml"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-report
          path: ${{ runner.temp }}/maestro-report.xml
          retention-days: 14
