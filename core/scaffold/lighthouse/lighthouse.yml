# Lighthouse CI: lab Core Web Vitals and byte budgets on key pages. Generated by `eos scaffold lighthouse`;
# yours to edit. Budgets live in {{DIR}}/lighthouserc.json (sources: .eos/packs/ref/frontend/web-vitals-budgets.md):
#   LCP <= 2500 ms, CLS <= 0.1, TBT <= 200 ms (web.dev thresholds; TBT is the lab stand-in for INP),
#   script <= 365 KiB and total <= 730 KiB transferred (Alex Russell, Performance Inequality Gap 2024:
#   a 3 s target at P75 device and network). Median of 3 runs. Lab numbers vary: compare trends, and
#   check field data (useReportWebVitals) before celebrating. Raise a budget only with a reason in the PR.
# Reports stay private: upload.target is "filesystem" and the reports are a workflow artifact
# ("temporary-public-storage" would publish them). @lhci/cli is Apache-2.0 and runs via npx at a pinned version.
name: lighthouse
on:
  pull_request: # add `paths:` (e.g. your web app folder) in a monorepo
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lhci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: {{DIR}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
{{NODE_SETUP}}      - name: Install
        run: {{PM_INSTALL}}
      - name: Build
        run: {{PM}} run build
      - name: Lighthouse CI (collect + assert)
        run: npx --yes @lhci/cli@{{LHCI_VERSION}} autorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: {{DIR}}/.lighthouseci/reports
          retention-days: 14
          if-no-files-found: ignore
