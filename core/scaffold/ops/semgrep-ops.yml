# eos operations rules for Semgrep: secrets and personal data in logs. Generated by `eos scaffold ops`.
# Run: semgrep scan --config .semgrep/ --error --metrics=off   (the security scaffold's workflow does this)
# Logs are copied to vendors, kept for months and read by many people, so treat them as public-ish.
# Log an ID (user_id, payment_id, trace_id) instead of the value. Suppress a reviewed false positive with
# `# nosemgrep: <rule-id>` (or `// nosemgrep: <rule-id>`) AND a reason. Ref: ops/opentelemetry.
rules:
  - id: eos-log-secret
    message: >-
      A secret (password, token, API key, Authorization header, cookie, card number) is written to a log.
      Log that it was present, or an ID, never the value (ops/opentelemetry, security/secrets-keys).
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $LOG.$M(..., $X, ...)
          - pattern: |
              $LOG.$M(..., f"...{$X}...", ...)
          - pattern: |
              $LOG.$M(..., extra={..., $K: $X, ...}, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(\w+\.)*_?(log|logger|logging|structlog)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(debug|info|warning|warn|error|exception|critical|log|msg)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(.*[.\[])?["']?(\w+_)?(password|passwd|secret|token|api_?key|authorization|cookie|card_?number|cvv)["']?\]?$

  - id: eos-js-log-secret
    message: >-
      A secret (password, token, API key, Authorization header, cookie, card number) is written to a log.
      Log that it was present, or an ID, never the value (ops/opentelemetry, security/secrets-keys).
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: $LOG.$M(..., $X, ...)
          - pattern: |
              $LOG.$M(..., `...${$X}...`, ...)
          - pattern: |
              $LOG.$M(..., {..., $K: $X, ...}, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(\w+\.)*(console|log|logger|pino)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(debug|info|warn|error|log|trace|fatal)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(.*[.\[])?["']?(\w+_)?(password|passwd|secret|token|api_?key|apiKey|accessToken|refreshToken|authorization|cookie|card_?number|cardNumber|cvv)["']?\]?$

  - id: eos-log-personal-data
    message: >-
      Personal data (email, phone/MSISDN, national ID, date of birth) is written to a log. Log the user or
      record ID instead; if you truly need it, mask it and record why (ops/opentelemetry, security/privacy).
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $LOG.$M(..., $X, ...)
          - pattern: |
              $LOG.$M(..., f"...{$X}...", ...)
          - pattern: |
              $LOG.$M(..., extra={..., $K: $X, ...}, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(\w+\.)*_?(log|logger|logging|structlog)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(debug|info|warning|warn|error|exception|critical|log|msg)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(.*[.\[])?["']?(\w+_)?(email|phone|phone_number|msisdn|national_id|id_number|date_of_birth|dob)["']?\]?$

  - id: eos-js-log-personal-data
    message: >-
      Personal data (email, phone/MSISDN, national ID, date of birth) is written to a log. Log the user or
      record ID instead; if you truly need it, mask it and record why (ops/opentelemetry, security/privacy).
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: $LOG.$M(..., $X, ...)
          - pattern: |
              $LOG.$M(..., `...${$X}...`, ...)
          - pattern: |
              $LOG.$M(..., {..., $K: $X, ...}, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(\w+\.)*(console|log|logger|pino)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(debug|info|warn|error|log|trace|fatal)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(.*[.\[])?["']?(\w+_)?(email|phone|phoneNumber|phone_number|msisdn|nationalId|national_id|dateOfBirth|date_of_birth|dob)["']?\]?$

  - id: eos-log-request-body
    message: >-
      A whole request body, form or header set is logged. It will contain passwords, tokens or personal data
      sooner or later. Log selected, non-sensitive fields (ops/opentelemetry).
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $LOG.$M(..., $X, ...)
          - pattern: |
              $LOG.$M(..., f"...{$X}...", ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(\w+\.)*_?(log|logger|logging|structlog)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(debug|info|warning|warn|error|exception|critical|log|msg)$
      - metavariable-regex:
          metavariable: $X
          regex: ^(await\s+)?(request|req)\.(json|form|data|body|headers|values|get_json|get_data)(\(\))?$

  - id: eos-js-log-request-body
    message: >-
      A whole request body or header set is logged. It will contain passwords, tokens or personal data sooner
      or later. Log selected, non-sensitive fields (ops/opentelemetry).
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: $LOG.$M(..., $X, ...)
          - pattern: |
              $LOG.$M(..., `...${$X}...`, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(\w+\.)*(console|log|logger|pino)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(debug|info|warn|error|log|trace|fatal)$
      - metavariable-regex:
          metavariable: $X
          regex: ^(await\s+)?(request|req)\.(body|headers|json\(\)|formData\(\)|text\(\))$
