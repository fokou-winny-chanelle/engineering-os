# Unit tests for the generated SLO alerts (promtool test rules). Generated by `eos scaffold ops`.
# They exercise the example api-availability SLO; when you change ops/slo.json, change the series here too.
# Run: promtool test rules ops/alerts/tests/*.yml   (the ops workflow does). Docs:
# https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/
rule_files:
  - ../slo-burn-rate.rules.yml
evaluation_interval: 1m
tests:
  - name: 10% errors for an hour pages and tickets
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="{{PROJECT_NAME}}",http_response_status_code="200"}'
        values: "0+90x120"
      - series: 'http_server_request_duration_seconds_count{job="{{PROJECT_NAME}}",http_response_status_code="500"}'
        values: "0+10x120"
    alert_rule_test:
      - eval_time: 60m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: page
              slo: api-availability
              service: "{{PROJECT_NAME}}"
            exp_annotations:
              summary: "{{PROJECT_NAME}}: api-availability is burning its error budget (99.5% over 28d)"
              description: "API requests succeed (anything but a 5xx). Owner: @owner."
              runbook_url: docs/runbooks/api-slo.md
  - name: no errors, no alert
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="{{PROJECT_NAME}}",http_response_status_code="200"}'
        values: "0+100x120"
      - series: 'http_server_request_duration_seconds_count{job="{{PROJECT_NAME}}",http_response_status_code="500"}'
        values: "0+0x120"
    alert_rule_test:
      - eval_time: 60m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts: []
      - eval_time: 60m
        alertname: SLOErrorBudgetBurnSlow
        exp_alerts: []
  - name: 0.3% errors (inside a 99.5% objective) does not page
    interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="{{PROJECT_NAME}}",http_response_status_code="200"}'
        values: "0+997x120"
      - series: 'http_server_request_duration_seconds_count{job="{{PROJECT_NAME}}",http_response_status_code="500"}'
        values: "0+3x120"
    alert_rule_test:
      - eval_time: 60m
        alertname: SLOErrorBudgetBurnFast
        exp_alerts: []
