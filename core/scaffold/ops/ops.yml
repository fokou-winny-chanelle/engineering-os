# Operations config gates. Generated by `eos scaffold ops`; yours to edit.
# - eos ops check: SLO file schema, every alert has a severity and a runbook that exists, flag registry
#   (owner, expiry, no unregistered flags in code). `eos check` in the eos core job runs the same check.
# - eos ops alerts --check: the generated burn-rate rules match ops/slo.json (regenerate: eos ops alerts).
# - promtool check rules / test rules: the alert rules parse and, if you add ops/alerts/tests/*.yml unit tests,
#   fire when they should. promtool comes from the Prometheus release, checked against its sha256.
# Only runs when ops files change, never on the fast path. Why: .eos/packs/ref/ops/slo-error-budgets.md
name: ops
on:
  pull_request:
    paths: ["ops/**", "docs/runbooks/**", "monitoring/**", "prometheus/**", ".github/workflows/ops.yml"]
  push:
    branches: [main]
    paths: ["ops/**", "docs/runbooks/**", "monitoring/**", "prometheus/**"]
permissions:
  contents: read
concurrency:
  group: ops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROM_VERSION: "{{PROMETHEUS_VERSION}}"
      PROMTOOL_TGZ_SHA256: "{{PROMETHEUS_SHA256}}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: eos ops check
        run: python3 .eos/bin/eos.py ops check
      - name: Generated alert rules up to date
        run: python3 .eos/bin/eos.py ops alerts --check
      - name: Install promtool (checksum-verified)
        run: |
          f="prometheus-${PROM_VERSION}.linux-amd64"
          curl -fsSL -o "$RUNNER_TEMP/p.tgz" "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${f}.tar.gz"
          echo "${PROMTOOL_TGZ_SHA256}  $RUNNER_TEMP/p.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/p.tgz" -C "$RUNNER_TEMP" "${f}/promtool"
          echo "$RUNNER_TEMP/${f}" >> "$GITHUB_PATH"
      - name: promtool check rules
        run: |
          shopt -s nullglob globstar
          rules=(ops/alerts/*.y*ml monitoring/alerts/**/*.y*ml prometheus/rules/**/*.y*ml)
          if [ ${#rules[@]} -eq 0 ]; then echo "no rule files"; exit 0; fi
          promtool check rules "${rules[@]}"
      - name: promtool test rules
        run: |
          shopt -s nullglob
          tests=(ops/alerts/tests/*.y*ml)
          if [ ${#tests[@]} -eq 0 ]; then echo "::notice::no alert unit tests in ops/alerts/tests/"; exit 0; fi
          promtool test rules "${tests[@]}"
