# eos frontend rules for Semgrep: browser storage of tokens, server secrets in Client Components, eval sinks.
# Generated by `eos scaffold web-security`; run by the security scaffold's workflow
# (semgrep scan --config .semgrep/ --error --metrics=off). Suppress a reviewed false positive with
# `// nosemgrep: <rule-id>` AND a reason. Ref: .eos/packs/ref/frontend/web-security.md.
rules:
  - id: eos-web-storage-token
    message: >-
      A token or session value is written to localStorage/sessionStorage, where any XSS can read it (OWASP HTML5
      Security Cheat Sheet). Keep sessions in an HttpOnly, Secure, SameSite cookie set by the server (a BFF for
      third-party OAuth). Ref: frontend/web-security, security/oauth-oidc-jwt.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $S.setItem($KEY, ...)
              - pattern: $S[$KEY] = $V
          - metavariable-regex:
              metavariable: $S
              regex: ^(window\.)?(localStorage|sessionStorage)$
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^["'`].*(token|jwt|session|auth|refresh|access|bearer|credential|secret).*["'`]$
      - patterns:
          - pattern: $S.$PROP = $V
          - metavariable-regex:
              metavariable: $S
              regex: ^(window\.)?(localStorage|sessionStorage)$
          - metavariable-regex:
              metavariable: $PROP
              regex: (?i)^.*(token|jwt|session|auth|refresh|access|bearer|credential|secret).*$

  - id: eos-client-private-env
    message: >-
      A non-public environment variable is read in a "use client" file. Only NEXT_PUBLIC_* values are inlined
      into browser code (at build time, publicly); anything else is undefined there or, if renamed public, leaks.
      Read it in a Server Component, Server Action or Route Handler instead. Ref: frontend/nextjs-actions-routes.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-inside: |
          "use client";
          ...
      - pattern: process.env.$X
      - metavariable-regex:
          metavariable: $X
          regex: ^(?!NEXT_PUBLIC_|NODE_ENV$)

  - id: eos-js-eval-sink
    message: >-
      eval / new Function / string timers execute text as code: one injected string becomes XSS, and a strict CSP
      blocks them anyway. Parse data (JSON.parse) or call functions directly. Ref: frontend/web-security.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: setTimeout("...", ...)
      - pattern: setInterval("...", ...)
