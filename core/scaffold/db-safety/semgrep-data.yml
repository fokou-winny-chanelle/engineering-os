# eos data rules: money stored or converted as binary floating point. Generated by `eos scaffold db-safety`.
# Run: semgrep scan --config .semgrep/ --error --metrics=off
# A money-like name (amount, price, fee, ...) typed float/double/real is flagged; names that look like rates or
# ratios (a rate, ratio, pct, percent, score, weight or factor word: tax_rate, taxRate) are skipped. False positive? Add
# `nosemgrep: <rule-id>` with a reason. Rules: .eos/packs/ref/data/keys-money-time.md
rules:
  - id: eos-money-float-orm-python
    message: "Money column '$NAME' uses a floating-point type. Store money as integer minor units (bigint) plus a currency code, or as an exact decimal (numeric/Decimal). Binary floating point cannot represent most decimal fractions exactly. SQLAlchemy: Numeric(p, s) or BigInteger; Django: DecimalField."
    severity: ERROR
    languages: [python]
    metadata:
      category: correctness
      references: ["https://www.postgresql.org/docs/current/datatype-numeric.html", ".eos/packs/ref/data/keys-money-time.md"]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $NAME = $COL(..., $T, ...)
                  - pattern: $NAME = $COL(..., $T(...), ...)
                  - pattern: '$NAME: $A = $COL(..., $T, ...)'
                  - pattern: '$NAME: $A = $COL(..., $T(...), ...)'
              - metavariable-regex:
                  metavariable: $COL
                  regex: '^((sa|sqlalchemy)\.)?(Column|mapped_column)$'
              - metavariable-regex:
                  metavariable: $T
                  regex: '^((sa|sqlalchemy|types)\.)?(Float|Double|REAL|DOUBLE|DOUBLE_PRECISION|FLOAT)$'
          - pattern: '$NAME: Mapped[float] = $X'
          - pattern: '$NAME: Mapped[float]'
          - pattern: '$NAME: Mapped[Optional[float]] = $X'
          - pattern: '$NAME: Mapped[float | None] = $X'
          - pattern: '$NAME = $M.FloatField(...)'
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i)^(?![_a-z0-9]*?(?:(?<![a-z])(?:rate|ratio|pct|percent|score|weight|factor)s?(?![a-z])|(?-i:(?:Rate|Ratio|Pct|Percent|Score|Weight|Factor)s?(?![a-z]))))[_a-z0-9]*(amount|price|cost|balance|total|fee|tax|salary|wage|revenue|payment|refund|discount|charge|payout|credit|debit|money|cents)[_a-z0-9]*$'
  - id: eos-money-float-conversion
    message: "Money value converted through float. Parse money with Decimal(str_value) or into integer minor units; Decimal(<float literal>) keeps the binary error."
    severity: WARNING
    languages: [python]
    metadata:
      category: correctness
      references: ["https://www.postgresql.org/docs/current/datatype-numeric.html", ".eos/packs/ref/data/keys-money-time.md"]
    pattern-either:
      - patterns:
          - pattern: float($E)
          - metavariable-regex:
              metavariable: $E
              regex: '(?i)^(?!.*?(?:(?<![a-z])(?:rate|ratio|pct|percent|score|weight|factor)s?(?![a-z])|(?-i:(?:Rate|Ratio|Pct|Percent|Score|Weight|Factor)s?(?![a-z])))).*(amount|price|cost|balance|total|fee|tax|salary|wage|revenue|payment|refund|discount|charge|payout|credit|debit|money|cents)'
      - patterns:
          - pattern: $D($F)
          - metavariable-regex:
              metavariable: $D
              regex: '^(decimal\.)?Decimal$'
          - metavariable-regex:
              metavariable: $F
              regex: '^-?[0-9]*\.[0-9]+$'
  - id: eos-money-float-js
    message: "Money value parsed with parseFloat. Keep money as integer minor units (number or bigint) or a decimal library/string end to end."
    severity: WARNING
    languages: [typescript, javascript]
    metadata:
      category: correctness
      references: ["https://www.postgresql.org/docs/current/datatype-numeric.html", ".eos/packs/ref/data/keys-money-time.md"]
    patterns:
      - pattern-either:
          - pattern: parseFloat($E)
          - pattern: Number.parseFloat($E)
      - metavariable-regex:
          metavariable: $E
          regex: '(?i)^(?!.*?(?:(?<![a-z])(?:rate|ratio|pct|percent|score|weight|factor)s?(?![a-z])|(?-i:(?:Rate|Ratio|Pct|Percent|Score|Weight|Factor)s?(?![a-z])))).*(amount|price|cost|balance|total|fee|tax|salary|wage|revenue|payment|refund|discount|charge|payout|credit|debit|money|cents)'
  - id: eos-money-float-drizzle
    message: "Money column '$K' uses a floating-point type. Store money as integer minor units (bigint) plus a currency code, or as an exact decimal (numeric/Decimal). Binary floating point cannot represent most decimal fractions exactly. Drizzle: numeric({ precision, scale }) or bigint({ mode: 'bigint' })."
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: correctness
      references: ["https://www.postgresql.org/docs/current/datatype-numeric.html", ".eos/packs/ref/data/keys-money-time.md"]
    patterns:
      - pattern-either:
          - pattern: '{..., $K: $F(...), ...}'
          - pattern: '{..., $K: $F(...).$M(...), ...}'
          - pattern: '{..., $K: $F(...).$M(...).$N(...), ...}'
      - metavariable-regex:
          metavariable: $F
          regex: '^(real|doublePrecision|double)$'
      - metavariable-regex:
          metavariable: $K
          regex: '(?i)^(?![_a-z0-9]*?(?:(?<![a-z])(?:rate|ratio|pct|percent|score|weight|factor)s?(?![a-z])|(?-i:(?:Rate|Ratio|Pct|Percent|Score|Weight|Factor)s?(?![a-z]))))[_a-z0-9]*(amount|price|cost|balance|total|fee|tax|salary|wage|revenue|payment|refund|discount|charge|payout|credit|debit|money|cents)[_a-z0-9]*$'
      - focus-metavariable: $K
  - id: eos-money-float-prisma
    message: "Money field typed Float. Store money as integer minor units (bigint) plus a currency code, or as an exact decimal (numeric/Decimal). Binary floating point cannot represent most decimal fractions exactly. Prisma: Decimal (@db.Decimal(p, s)) or BigInt minor units."
    severity: ERROR
    languages: [generic]
    paths:
      include: ["*.prisma"]
    metadata:
      category: correctness
      references: ["https://www.postgresql.org/docs/current/datatype-numeric.html", ".eos/packs/ref/data/keys-money-time.md"]
    pattern-regex: '(?im)^\s*(?![A-Za-z0-9_]*?(?:(?<![a-z])(?:rate|ratio|pct|percent|score|weight|factor)s?(?![a-z])|(?-i:(?:Rate|Ratio|Pct|Percent|Score|Weight|Factor)s?(?![a-z]))))[A-Za-z0-9_]*(amount|price|cost|balance|total|fee|tax|salary|wage|revenue|payment|refund|discount|charge|payout|credit|debit|money|cents)[A-Za-z0-9_]*\s+Float\b'
  - id: eos-money-float-sql
    message: "Money column typed real/double precision/float/money. Store money as integer minor units (bigint) plus a currency code, or as an exact decimal (numeric/Decimal). Binary floating point cannot represent most decimal fractions exactly. The money type also depends on lc_monetary; prefer numeric(p, s) or bigint minor units plus a currency column."
    severity: ERROR
    languages: [generic]
    paths:
      include: ["*.sql"]
    metadata:
      category: correctness
      references: ["https://www.postgresql.org/docs/current/datatype-numeric.html", ".eos/packs/ref/data/keys-money-time.md"]
    pattern-regex: '(?i)"?\b(?![a-z0-9_]*?(?:(?<![a-z])(?:rate|ratio|pct|percent|score|weight|factor)s?(?![a-z])|(?-i:(?:Rate|Ratio|Pct|Percent|Score|Weight|Factor)s?(?![a-z]))))[a-z0-9_]*(amount|price|cost|balance|total|fee|tax|salary|wage|revenue|payment|refund|discount|charge|payout|credit|debit|money|cents)[a-z0-9_]*"?\s+(real|double\s+precision|float[48]?|float\s*\(\s*[0-9]+\s*\)|money)\b'
