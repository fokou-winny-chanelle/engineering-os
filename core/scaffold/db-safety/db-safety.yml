# Database safety gates. Generated by `eos scaffold db-safety`; yours to edit.
# - alembic-lint: squawk on the SQL each changed Alembic revision would run (offline, no database).
#   (Raw SQL migrations under migrations/ or drizzle/ are already linted by the eos core CI job.)
# - schema-lint: migrate an empty Postgres to head, then scripts/db/schema_lint.sql fails on unindexed
#   foreign keys and money stored as float. Set MIGRATE below if auto-detection does not fit your repo.
# - semgrep-data: money-as-float rules for ORM models, Prisma schemas and SQL (.semgrep/eos-data.yml).
#   If `eos scaffold security` is installed, its semgrep job already scans .semgrep/; delete this job then.
# Actions are pinned to full commit SHAs with the version in a comment; Renovate (.github/renovate.json,
# helpers:pinGitHubActionDigests) bumps both. `eos check` warns on unpinned actions in your own workflows.
# Why: .eos/packs/ref/data/migrations.md, data/postgres-indexing.md, data/keys-money-time.md
name: db-safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: db-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alembic-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Offline mode only needs the dialect; nothing connects to this URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: squawk on changed Alembic revisions (scripts/db/alembic_squawk.py)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALEMBIC: uv run alembic
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD | grep -E '(^|/)versions/[^/]+\.py$' || true)
          if [ -z "$files" ]; then echo "no Alembic revisions changed"; exit 0; fi
          echo "$files" | xargs python3 scripts/db/alembic_squawk.py
  schema-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:{{PG_TAG}}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Your migrate-to-head command; empty = auto-detect (Alembic, Prisma, Drizzle) below.
      MIGRATE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Migrate an empty database to head
        run: |
          pkgdir() { d=$(dirname "$1"); while [ "$d" != "." ] && [ ! -f "$d/package.json" ]; do d=$(dirname "$d"); done; echo "$d"; }
          if [ -n "$MIGRATE" ]; then sh -c "$MIGRATE"
          elif ini=$(git ls-files '*alembic.ini' | head -n 1) && [ -n "$ini" ]; then
            (cd "$(dirname "$ini")" && uv run alembic upgrade head)
          elif f=$(git ls-files '*schema.prisma' | head -n 1) && [ -n "$f" ]; then
            # Prisma 7 command; on a newer major, check its migrate docs and set MIGRATE.
            (cd "$(pkgdir "$f")" && corepack enable && {{PM_INSTALL}} && npx --no-install prisma migrate deploy)
          elif f=$(git ls-files '*drizzle.config.*' | head -n 1) && [ -n "$f" ]; then
            (cd "$(pkgdir "$f")" && corepack enable && {{PM_INSTALL}} && npx --no-install drizzle-kit migrate)
          else
            echo "::error::no migration tool detected; set MIGRATE in .github/workflows/db-safety.yml"; exit 1
          fi
      - name: Schema lint (unindexed foreign keys, money as float; timestamp without time zone is a warning)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db/schema_lint.sql
  semgrep-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (eos money-as-float rules)
        run: pipx run semgrep scan --config .semgrep/eos-data.yml --error --metrics=off
