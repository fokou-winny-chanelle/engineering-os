# Squawk config (PostgreSQL migration lint). Generated by `eos scaffold db-safety`; yours to edit.
# Picked up automatically: squawk traverses up from the working directory for .squawk.toml, so the eos core
# CI job (changed migrations/**.sql and drizzle/**.sql) uses it too. Rules: https://squawkhq.com/docs/rules
# Why each setting (see .eos/packs/ref/data/migrations.md):
pg_version = "18.0"            # set to your production major: some rules depend on it (e.g. adding-field-with-default
                               # fires for a constant DEFAULT only below 11.0)
assume_in_transaction = true   # Alembic and Prisma 8 run migrations inside a transaction;
                               # this flags CREATE INDEX CONCURRENTLY inside one and silences prefer-robust-stmts.
                               # A file that runs outside a transaction starts with:
                               #   -- squawk-disable-assume-in-transaction
excluded_rules = [
  # Add a rule here only with a reason. Per statement, prefer:  -- squawk-ignore <rule>  (plus a reason)
]
included_rules = [
  # Opt-in rules worth considering once the basics pass, e.g. "require-table-schema".
]
# Generated or vendored SQL you cannot change:
excluded_paths = []
