name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest steps. The fix starts with a failing test for this.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, trace id, request id, screenshots. Never paste secrets or customer PII.
  - type: input
    id: version
    attributes:
      label: Version / commit / environment
