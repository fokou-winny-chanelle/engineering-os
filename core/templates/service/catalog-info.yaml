# Backstage catalog descriptor (https://backstage.io/docs/features/software-catalog/descriptor-format).
# Useful even without Backstage: one machine-readable place for owner, lifecycle and APIs.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: {{NAME}}
  description: <one sentence>
spec:
  type: service
  lifecycle: experimental
  owner: {{OWNER_PLAIN}}
  system: {{SYSTEM}}
  providesApis:
    - {{NAME}}-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: {{NAME}}-api
spec:
  type: openapi
  lifecycle: experimental
  owner: {{OWNER_PLAIN}}
  system: {{SYSTEM}}
  definition:
    $text: ./openapi.yaml
